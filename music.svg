<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-music">
      <rect width="360" height="100" rx="12"/>
    </clipPath>
    <linearGradient id="bg-music" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <radialGradient id="glow-music" cx="10%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#9ece6a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border-music" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#30363d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e242c" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse {
      0%, 100% { opacity: 0.16; }
      50% { opacity: 0.5; }
    }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
  </style>
  <g clip-path="url(#clip-music)">
    <rect width="360" height="100" fill="url(#bg-music)"/>
    <rect width="360" height="100" fill="url(#glow-music)"/>
  </g>
  <rect x="0.5" y="0.5" width="359" height="99" rx="11.5" fill="none" stroke="url(#border-music)" stroke-width="1"/>
  <circle cx="22" cy="24" r="8" fill="#9ece6a" class="pulse"/>
  <circle cx="22" cy="24" r="3.5" fill="#9ece6a"/>
  <text x="36" y="28" fill="#94a3b8" font-size="10.5" font-weight="600" letter-spacing="1.2">MUSIC</text>
  <text x="340" y="28" text-anchor="end" fill="#9ece6a" opacity="1" font-size="9.5" font-weight="600" letter-spacing="0.8">NOW PLAYING</text>
  <text x="20" y="60" fill="#f8fafc" font-size="16.5" font-weight="700">WHERE YOU FROM</text>
  <text x="20" y="81" fill="#94a3b8" font-size="11.5">21 Savage</text>
</svg>