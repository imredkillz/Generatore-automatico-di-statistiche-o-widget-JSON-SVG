<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-music">
      <rect width="360" height="100" rx="12"/>
    </clipPath>
    <radialGradient id="glow-music" cx="10%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border-music" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes pulse {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.42; }
    }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
  </style>
  <g clip-path="url(#clip-music)">
    <rect width="360" height="100" fill="#0d1117"/>
    <rect width="360" height="100" fill="url(#glow-music)"/>
  </g>
  <rect x="0.5" y="0.5" width="359" height="99" rx="11.5" fill="none" stroke="url(#border-music)" stroke-width="1"/>
  <circle cx="22" cy="24" r="7.5" fill="#1db954" class="pulse"/>
  <circle cx="22" cy="24" r="3.5" fill="#1db954"/>
  <text x="36" y="28" fill="#8b949e" font-size="10.5" font-weight="600" letter-spacing="1.2">MUSIC</text>
  <text x="340" y="28" text-anchor="end" fill="#1db954" font-size="9.5" font-weight="600" letter-spacing="0.8">NOW PLAYING</text>
  <text x="20" y="60" fill="#e6edf3" font-size="16.5" font-weight="700">Catastrophe</text>
  <text x="20" y="81" fill="#8b949e" font-size="11.5">Ken Carson</text>
</svg>